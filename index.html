<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Hang Out With Me ❤️</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div class="container">

<div class="progress">
<div id="progressBar"></div>
</div>

<form id="quizForm">

<!-- Question 1 -->

<div class="question active">

<h1>❤️ Hang Out With Me ❤️</h1>

<h2>What's your name?</h2>

<input
type="text"
id="name"
placeholder="Your name"
required>

<button type="button" onclick="nextQuestion()">
Next ➜
</button>

</div>

<!-- Question 2 -->

<div class="question">

<h2>How old are you? 🎂</h2>

<input
type="number"
id="age"
placeholder="Your age"
required>

<button type="button" onclick="nextQuestion()">
Next ➜
</button>

</div>

<!-- Question 3 -->

<div class="question">

<h2>What do you like? ❤️</h2>

<label>

<input type="checkbox" value="Cooking">

Cooking 🍳

</label>

<label>

<input type="checkbox" value="Sleeping">

Sleeping 😴

</label>

<label>

<input type="checkbox" value="Reading">

Reading 📚

</label>

<label>

<input type="checkbox" value="Listening to Music">

Listening to Music 🎵

</label>

<button type="button" onclick="nextQuestion()">
Next ➜
</button>

</div>

<!-- Question 4 -->

<div class="question">

<h2>Do you want to hang out with me? ❤️</h2>

<button
type="button"
onclick="nextQuestion()">
YES ❤️
</button>

<button
type="button"
id="noBtn">
NO 😈
</button>

</div>

<!-- Question 5 -->

<div class="question">

<h2>Choose Date 📅</h2>

<select id="date">

<option>04/08/2026</option>

<option>05/08/2026</option>

<option>06/08/2026</option>

<option>07/08/2026</option>

</select>

<button type="button" onclick="nextQuestion()">
Next ➜
</button>

</div>
