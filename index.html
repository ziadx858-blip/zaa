<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang Out With Me ❤️</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>❤️ Hang Out With Me ❤️</h1>

<form id="quizForm">

<label>Your Name</label>
<input type="text" id="name" required>

<label>Your Age</label>
<input type="number" id="age" required>

<label>What do you like to do?</label>

<select id="hobby">

<option value="Cooking">Cooking 🍳</option>

<option value="Sleeping">Sleeping 😴</option>

<option value="Reading">Reading 📚</option>

<option value="Listening to Music">Listening to Music 🎵</option>

</select>

<label>Write anything you want ❤️</label>

<textarea id="message" rows="5"></textarea>

<label>Choose your favorite song 🎵</label>

<input type="file" id="audio" accept="audio/*">

<br><br>

<audio id="player" controls></audio>

<br><br>

<button type="submit">
Submit ❤️
</button>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
